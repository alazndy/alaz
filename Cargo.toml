[workspace]
resolver = "2"
members = ["crates/sim", "crates/render", "crates/net", "crates/game"]

[workspace.package]
version = "0.3.1"
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# a debug build of a game is unplayable: keep our own code checkable (overflow checks stay) but not glacial,
# and build the heavy dependencies (egui, wgpu) optimised
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
