# A.L.A.Z rules: buildings and recipes. Order matters (saves refer to recipes by index);
# the save format stores a checksum of this file and rejects saves made with other rules.

# Pick tier needed to step down into each cave chamber (stone 0, copper 1, bronze 2, iron 3).
# Chamber 1 asks for copper once copper tools exist; until then stone.
cave_tiers = [0, 1, 2, 3]

