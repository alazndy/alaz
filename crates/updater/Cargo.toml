[package]
name = "alaz-updater"
version.workspace = true
edition.workspace = true

# Skeleton stage: the HTTP client (ureq with rustls + ring) and a SHA-256 crate are added with the logic,
# after `cargo audit` has been run on them.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
