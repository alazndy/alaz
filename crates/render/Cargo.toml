[package]
name = "alaz-render"
version.workspace = true
edition.workspace = true

[dependencies]
alaz-sim = { path = "../sim" }
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
glam = "0.34.2"
pollster = "1.0.1"
wgpu = "30.0.1"
# asset files: MagicaVoxel and glTF models (pure Rust, no image decoder pulled in), PNG pictures, glTF extras
dot_vox = "5.2.0"
gltf = { version = "1.4.1", default-features = false, features = ["names", "extras", "utils"] }
png = "0.18.1"
serde_json = "1"
toml = "1.2.0"
winit = "0.30.13"

