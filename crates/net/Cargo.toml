[package]
name = "alaz-net"
version.workspace = true
edition.workspace = true

[dependencies]
alaz-sim = { path = "../sim" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
alaz-relay-proto = { path = "../relay-proto" }
serde = { version = "1.0.229", features = ["derive"] }
# ring only: aws-lc-rs would need cmake and a C toolchain
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# the relay certificate is checked against these roots only, never the system store
webpki-roots = "1"
# TCP keepalive on client sockets; with_interval and with_retries sit behind the "all" feature
socket2 = { version = "0.5", features = ["all"] }

[dev-dependencies]
alaz-relay = { path = "../relay" }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
